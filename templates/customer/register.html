{% extends 'base.html' %}
{% block title %}Create Account{% endblock %}

{% block content %}
<div class="form">
    <div style="text-align: center; margin-bottom: 22px;">
        <div class="flaticon-badge flaticon-badge-lg flaticon-badge-indigo" style="margin: 0 auto 12px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
        </div>
        <h1 style="margin: 0 0 6px; font-size: 26px;">Create Account</h1>
        <p class="form-subtitle">Join MobileStore to buy smartphones and track deliveries.</p>
    </div>

    <form method="post" action="{% url 'signup' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="username">Username *</label>
            <div class="input-icon-wrap">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </span>
                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required
                    autocomplete="username"
                >
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email Address *</label>
            <div class="input-icon-wrap">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </span>
                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="name@example.com"
                    required
                    autocomplete="email"
                >
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password *</label>
            <div class="input-icon-wrap">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </span>
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="At least 8 characters"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >
            </div>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password *</label>
            <div class="input-icon-wrap">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </span>
                <input
                    id="confirm_password"
                    type="password"
                    name="confirm_password"
                    placeholder="Re-enter password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >
            </div>
        </div>

        <button type="submit" class="btn btn-full btn-with-icon" style="margin-top: 10px;">
            <span>Register Account</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>
    </form>

    <div class="form-footer-text">
        Already registered? <a href="{% url 'login' %}">Sign in here</a>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 18px; font-size: 12px; color: #64748b;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>End-to-End Encrypted Registration</span>
    </div>
</div>

<script>
document.querySelector('form').addEventListener('submit', function(e) {
    var p1 = document.getElementById('password').value;
    var p2 = document.getElementById('confirm_password').value;
    if (p1 !== p2) {
        e.preventDefault();
        alert('Passwords do not match. Please verify and re-enter.');
        document.getElementById('confirm_password').focus();
    }
});
</script>
{% endblock %}
