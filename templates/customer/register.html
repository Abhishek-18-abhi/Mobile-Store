
{% extends 'base.html' %}

{% block title %}Signup{% endblock %}

{% block content %}

<form class="form" method="post" data-auth-form="signup">
    {% csrf_token %}

    <h1>Create Account</h1>

    <label>Username</label>
    <input
        type="text"
        name="username"
        required
        autocomplete="name"
    >

    <label>Email</label>
    <input
        type="email"
        name="email"
        required
        autocomplete="email"
    >

    <label>Password</label>
    <input
        type="password"
        name="password"
        required
        minlength="8"
        autocomplete="new-password"
    >

    <label>Confirm Password</label>
    <input
        type="password"
        name="confirm_password"
        required
        minlength="8"
        autocomplete="new-password"
    >

    <button type="submit">Create Account</button>

    <p>Already registered?
        <a href="{% url 'login' %}">Login</a>
    </p>
</form>

{% endblock %}
