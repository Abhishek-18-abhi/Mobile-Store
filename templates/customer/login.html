
{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<form class="form" method="post" data-auth-form="login">
    {% csrf_token %}

    <h1>Customer Login</h1>

    <label>Email</label>
    <input
        type="email"
        name="email"
        required
        autocomplete="email"
    >

    <label>Password</label>
    <input
        type="password"
        name="password"
        required
        autocomplete="current-password"
    >

    <button type="submit">Login</button>

    <p>New customer?
        <a href="{% url 'signup' %}">Create account</a>
    </p>
</form>

{% endblock %}
